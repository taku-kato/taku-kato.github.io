<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Takuya Kato 加藤匠哉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE3;
    --paper-2:#E4E0D6;
    --ink:#1D1C19;
    --ink-soft:#4A473F;
    --line: rgba(29,28,25,0.16);
    --line-strong: rgba(29,28,25,0.34);
    --accent-eng:#33465A;      /* engineering / mechanism / robot / research / project */
    --accent-craft:#5C6B44;    /* pottery / plant / craft */
    --paper-rgb: 237,234,227;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans JP','IBM Plex Mono',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  /* faint drafting grid */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity:0.35;
    pointer-events:none;
    z-index:0;
  }
  .wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:0 32px;}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(var(--paper-rgb),0.86);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:18px; padding-bottom:18px;
  }
  .brand{
    display:flex; flex-direction:column; gap:3px;
  }
  .brand-name{font-family:'Inter', sans-serif; font-weight:500; font-size:23px; letter-spacing:0.005em; color:var(--ink); line-height:1;}
  .brand-sub{font-family:'IBM Plex Mono', monospace; font-size:12.5px; letter-spacing:0.04em; color:var(--ink-soft);}
  nav{display:flex; align-items:center; gap:26px;}
  nav a{
    color:var(--ink); text-decoration:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px; letter-spacing:0.04em;
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:border-color .2s ease, color .2s ease;
  }
  nav a:hover{border-color:var(--ink);}
  .social-row{display:flex; gap:16px;}
  .social-row a{
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line-strong); border-radius:50%;
    color:var(--ink); transition:background .2s ease, color .2s ease, transform .2s ease;
  }
  .social-row a:hover{background:var(--ink); color:var(--paper); transform:translateY(-1px);}
  .social-row svg{width:13px; height:13px;}

  /* ---------- hero ---------- */
  .hero{padding:120px 0 90px;}
  .hero .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; letter-spacing:0.16em; text-transform:uppercase;
    color:var(--ink-soft); margin:0 0 22px;
    display:flex; align-items:center; gap:12px;
  }
  .hero .eyebrow::before{content:""; width:34px; height:1px; background:var(--line-strong); display:inline-block;}
  .hero h1{
    font-family:'Inter', sans-serif;
    font-weight:400;
    font-size:clamp(40px, 6vw, 74px);
    line-height:1.08;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .hero h1 em{font-style:italic; font-weight:300; color:var(--ink-soft);}
  .hero .kana{
    font-family:'IBM Plex Sans JP', sans-serif;
    font-weight:300; font-size:20px; color:var(--ink-soft);
    margin:0 0 40px;
  }
  .hero p.lede{
    font-family:'Inter', sans-serif; font-style:italic; font-weight:300;
    font-size:clamp(18px,2.4vw,23px);
    max-width:640px; line-height:1.65; color:var(--ink);
    margin:0;
  }

  /* ---------- section label ---------- */
  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    border-top:1px solid var(--line-strong);
    padding-top:18px; margin:0 0 46px;
  }
  .section-head h2{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px; letter-spacing:0.14em; text-transform:uppercase;
    margin:0; font-weight:500;
  }
  .section-head .count{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);
  }

  /* ---------- works grid ---------- */
  .works{padding:24px 0 40px;}
  .filters{
    display:flex; flex-wrap:wrap; gap:10px;
    margin-bottom:22px;
  }
  .filter-btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase;
    background:transparent; color:var(--ink-soft);
    border:1px solid var(--line-strong);
    padding:7px 14px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .filter-btn:hover{border-color:var(--ink); color:var(--ink);}
  .filter-btn.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .grid{
    position:relative;
    width:100%;
  }
  .card{
    background:var(--paper);
    padding:0;
    cursor:pointer;
    position:absolute;
    top:0; left:0;
    display:flex; flex-direction:column;
    transition:transform .55s cubic-bezier(.4,0,.2,1), opacity .4s ease, background .25s ease;
  }
  .card.is-hidden{
    opacity:0;
    transform-origin:center center;
    pointer-events:none;
    z-index:0;
  }
  .grid.instant .card{transition:none !important;}
  .card:hover{background:var(--paper-2);}
  .card .thumb{
    position:relative;
    width:100%; height:100%;
    overflow:hidden;
    background:#cfcbbf;
  }
  .card .thumb img{
    width:100%; height:100%; object-fit:cover;
    filter:grayscale(1) contrast(1.02);
    transform:scale(1.02);
    transition:filter .5s ease, transform .6s ease;
  }
  .card:hover .thumb img{filter:grayscale(0); transform:scale(1.07);}
  .tag{
    position:absolute; top:6px; left:6px; z-index:2;
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.1em;
    text-transform:uppercase;
    padding:4px 8px;
    background:var(--paper);
  }
  .tag.eng{color:var(--accent-eng);}
  .tag.craft{color:var(--accent-craft);}

  /* text overlay on top of the image, revealed on hover */
  .overlay-meta{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:22px 22px 24px;
    background:linear-gradient(180deg, rgba(20,19,16,0) 38%, rgba(17,16,14,0.88) 100%);
    opacity:0;
    transform:translateY(10px);
    transition:opacity .35s ease, transform .35s ease;
  }
  .card:hover .overlay-meta{opacity:1; transform:translateY(0);}
  .overlay-meta .index{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:rgba(237,234,227,0.72);
    display:block; margin-bottom:8px;
  }
  .overlay-meta h3{
    font-family:'Inter', sans-serif; font-weight:500; font-size:22px; color:var(--paper);
    margin:0 0 8px; line-height:1.25;
  }
  .overlay-meta h3 .year{
    font-family:'Inter', sans-serif; font-weight:600; font-size:15px;
    color:rgba(237,234,227,0.65); margin-left:10px; vertical-align:middle;
  }
  .overlay-meta p{
    font-size:13.5px; color:rgba(237,234,227,0.86); line-height:1.6; margin:0;
    font-weight:300;
  }
  .overlay-meta .open-hint{
    margin-top:14px; font-family:'IBM Plex Mono', monospace; font-size:11px;
    letter-spacing:0.05em; color:var(--paper);
  }

  @media (max-width:600px){
    header nav{display:flex;}
    header .wrap{flex-direction:column; align-items:flex-start; gap:12px;}
    nav{flex-wrap:wrap; gap:14px;}
    nav a{order:2;}
    .social-row{flex-basis:100%; margin-left:0 !important; order:1;}
    .brand-name{font-size:19px;}
  }

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--line-strong);
    padding:36px 0 48px;
  }
  footer .wrap{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;}
  footer p{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft); margin:0;
    letter-spacing:0.03em;
  }

  .fade-up{opacity:0; transform:translateY(18px); animation:fadeUp .8s ease forwards;}
  @keyframes fadeUp{to{opacity:1; transform:translateY(0);}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <span class="brand-name">TAKUYA KATO</span>
      <span class="brand-sub">加藤匠哉 — Robotics & HCI Researcher</span>
    </div>
    <nav>
      <a href="about.html">About</a>
      <a href="publications.html">Publications</a>
      <div class="social-row" style="margin-left:14px;">
        <a href="https://x.com/robokch" target="_blank" rel="noopener" aria-label="X">

</header>

<section class="works" id="works">
  <div class="wrap">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p>© 2026 Takuya Kato, All rights reserved.</p>
    <p>Tokyo, Japan</p>
  </div>
</footer>

<script>
const works = [
  {
    title:"Pottery",
    typeLabel:"personal",
    year:"— 2025",
    img:"fig/title/pottery_title.jpg",
    desc:"A traditional craft from my hometown. I'm practicing to master its techniques.",
    link:"pottery.html"
  },
  {
    title:"Climbing Robot",
    typeLabel:"research",
    year:"— 2023",
    img:"fig/title/climbing_robot_title.jpg",
    desc:"A climbing robot composed of gripping modules with a pin-array structure.",
    link:"climbing_robot.html"
  },  
  {
    title:"Pin-Array Gripper",
    typeLabel:"research",
    year:"— 2022",
    img:"fig/title/pin_array_gripper_title.jpg",
    desc:"A pin-array Structure for gripping and shape recognition of convex and concave terrain profiles.",
    link:"pin_array_gripper.html"
  },
  {
    title:"Parallel Link Robot",
    typeLabel:"personal",
    year:"— 2021",
    img:"fig/title/saize_title.jpg",
    desc:"A self-made parallel-link robot. It can solve spot-the-difference puzzles.",
    link:"parallel_link_robot.html"
  },
  {
    title:"Robot Contest",
    typeLabel:"club activity",
    year:"— 2019",
    img:"fig/title/robocon_title.jpg",
    desc:"A club activity I participated in during my undergraduate years with the goal of competing in the NHK Robocon.",
    link:"robot_contest.html"
  },
  {
    title:"Plant Physiology",
    typeLabel:"club activity",
    year:"— 2015",
    img:"fig/title/plant_physiology_title.jpg",
    desc:"A research topic I worked on in the science club during high school.",
    link:"plant_physiology.html"
  }
];

const grid = document.getElementById('grid');
let allCards = [];

function buildCards(){
  works.forEach((w) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.type = w.typeLabel;
    card.innerHTML = `
      <div class="thumb">
        <img src="${w.img}" alt="${w.title}" loading="lazy">
        <span class="tag ${w.category}">${w.typeLabel}</span>
        <div class="overlay-meta">
          <h3>${w.title}<span class="year">${w.year}</span></h3>
          <p>${w.desc}</p>
          <span class="open-hint">詳細を見る →</span>
        </div>
      </div>
    `;
    card.addEventListener('click', () => { window.location.href = w.link; });
    grid.appendChild(card);
    allCards.push(card);
  });
}

function getColumns(){
  const width = window.innerWidth;
  if (width <= 600) return 1;
  if (width <= 920) return 2;
  return 3;
}

function layout(){
  const gap = 4;
  const columns = getColumns();
  const containerWidth = grid.clientWidth;
  const colWidth = (containerWidth - gap * (columns - 1)) / columns;

  const visible = allCards.filter(c => !c.classList.contains('is-hidden'));
  visible.forEach((card, i) => {
    const col = i % columns;
    const row = Math.floor(i / columns);
    const x = col * (colWidth + gap);
    const y = row * (colWidth + gap);
    card.style.width = colWidth + 'px';
    card.style.height = colWidth + 'px';
    card.style.transform = `translate(${x}px, ${y}px)`;
  });

  const rows = Math.ceil(visible.length / columns) || 1;
  grid.style.height = (rows * colWidth + (rows - 1) * gap) + 'px';
}

let currentFilter = 'all';

function applyFilter(label){
  const directSwitch = currentFilter !== 'all' && label !== 'all' && currentFilter !== label;

  if (directSwitch) grid.classList.add('instant');

  allCards.forEach(card => {
    const match = label === 'all' || card.dataset.type === label;
    card.classList.toggle('is-hidden', !match);
  });
  layout();

  if (directSwitch){
    void grid.offsetHeight; // force reflow so the instant positioning applies immediately
    requestAnimationFrame(() => {
      requestAnimationFrame(() => grid.classList.remove('instant'));
    });
  }

  currentFilter = label;
}

buildCards();
grid.classList.add('instant');
layout();
void grid.offsetHeight;
requestAnimationFrame(() => {
  requestAnimationFrame(() => grid.classList.remove('instant'));
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    grid.classList.add('instant');
    layout();
    void grid.offsetHeight;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => grid.classList.remove('instant'));
    });
  }, 120);
});

const filterLabels = ['all', ...new Set(works.map(w => w.typeLabel))];
const filtersEl = document.getElementById('filters');
filterLabels.forEach(label => {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (label === 'all' ? ' active' : '');
  btn.textContent = label === 'all' ? 'All' : label;
  btn.dataset.filter = label;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(label);
  });
  filtersEl.appendChild(btn);
});

</script>

</body>
